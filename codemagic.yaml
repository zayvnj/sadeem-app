workflows:
  android-release:
    name: Sadeem Android Debug
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      node: 22.14.0
      java: 21
      groups:
        - zain
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'zain'
          include: true
          source: true
    scripts:
      - name: Install dependencies
        script: |
          npm install --force
      - name: Build Next.js
        script: |
          npm run build
      - name: Sync Capacitor
        script: |
          npx cap sync android
      - name: Build Android Debug APK
        script: |
          cd android
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/debug/**/*.apk
